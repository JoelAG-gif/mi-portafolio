<mat-toolbar class="navbar" [class.scrolled]="isScrolled">
  
  <a routerLink="/" class="logo" style="text-decoration: none; cursor: pointer;">PORTAFOLIO</a>
  
  <!-- MENÚ DESKTOP  -->
  <div class="nav-links desktop-menu">
    <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
    <a mat-button routerLink="/proyectos" routerLinkActive="active">Proyectos</a>
    <a mat-button routerLink="/habilidades" routerLinkActive="active">Habilidades</a>
    <a mat-button routerLink="/certificados" routerLinkActive="active">Certificados</a>
  </div>

  <!-- BOTONES DERECHA -->
  <div class="navbar-actions">
    <button mat-icon-button (click)="toggleTheme()" class="theme-toggle-button">
      <mat-icon>{{ themeService.isDarkTheme() ? 'dark_mode' : 'light_mode' }}</mat-icon>
    </button>
    
    <!-- BOTÓN (Solo móvil) -->
    <button mat-icon-button (click)="toggleMobileMenu()" class="mobile-menu-button">
      <mat-icon>{{ isMobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>

</mat-toolbar>

<!-- MENÚ MÓVIL DESPLEGABLE -->
<div class="mobile-menu-overlay" [class.open]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
<div class="mobile-menu" [class.open]="isMobileMenuOpen">
  <nav class="mobile-nav-links">
    <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">
      <mat-icon>home</mat-icon>
      <span>Inicio</span>
    </a>
    <a mat-button routerLink="/proyectos" routerLinkActive="active" (click)="closeMobileMenu()">
      <mat-icon>work</mat-icon>
      <span>Proyectos</span>
    </a>
    <a mat-button routerLink="/habilidades" routerLinkActive="active" (click)="closeMobileMenu()">
      <mat-icon>star</mat-icon>
      <span>Habilidades</span>
    </a>
    <a mat-button routerLink="/certificados" routerLinkActive="active" (click)="closeMobileMenu()">
      <mat-icon>school</mat-icon>
      <span>Certificados</span>
    </a>
    <a mat-button routerLink="/contacto" routerLinkActive="active" (click)="closeMobileMenu()">
      <mat-icon>email</mat-icon>
      <span>Contacto</span>
    </a>
  </nav>
</div>
